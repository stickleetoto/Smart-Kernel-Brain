name: SKB v2 CI

on:
  push:
    branches: [v2-ai]
    paths:
      - "v2/**"
      - ".github/workflows/v2-ci.yml"
      - "src/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "scripts/verify_core_freeze.py"
  pull_request:
    paths:
      - "v2/**"
      - "src/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"

jobs:
  v2-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify v1 frozen core remains untouched
        run: python scripts/verify_core_freeze.py
      - name: Format v2 crate
        run: cargo fmt --manifest-path v2/Cargo.toml -- --check
      - name: Clippy v2 crate
        run: cargo clippy --manifest-path v2/Cargo.toml --all-targets -- -D warnings
      - name: Test v2 crate
        run: cargo test --manifest-path v2/Cargo.toml
