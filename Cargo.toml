[package]
name = "smart-kernel-brain"
version = "1.1.0"
autobins = false
edition = "2021"
description = "High-performance local filename discovery with CLI, resident daemon, and MCP support"
license = "MIT"
repository = "https://github.com/stickleetoto/Smart-Kernel-Brain"
readme = "README.md"
keywords = ["file-search", "mcp", "cli", "daemon", "local-search"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "skb"
path = "src/lib.rs"

[[bin]]
name = "skb"
path = "src/bin/skb_entry.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
