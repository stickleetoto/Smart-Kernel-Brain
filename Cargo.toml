[package]
name = "smart-kernel-brain"
version = "1.0.0"
autobins = false
edition = "2021"
description = "Adaptive filename-only file locator with hot-cache weighting and MCP support"
license = "MIT"
repository = "https://github.com/stickleetoto/Smart-Kernel-Brain"

[lib]
name = "skb"
path = "src/lib.rs"

[[bin]]
name = "skb"
path = "src/bin/skb.rs"


[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
